<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EAG HUB</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%9A%3C/text%3E%3C/svg%3E" />
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-card">
    <div class="logo">EAG<span>HUB</span></div>
    <p class="muted">Introduce la API key del hub para conectarte al feed en vivo.</p>
    <input id="gateKey" type="password" placeholder="API key" autocomplete="off" />
    <button id="gateBtn">Conectar</button>
    <div id="gateErr" class="err"></div>
  </div>
</div>

<header class="topbar">
  <div class="logo">EAG<span>HUB</span></div>
  <div class="pill" id="connPill"><i class="dot"></i><span>conectando…</span></div>
  <div class="spacer"></div>
  <div class="kpis">
    <div class="kpi"><b id="kServers">0</b><span>servers</span></div>
    <div class="kpi"><b id="kEggs">0</b><span>huevos</span></div>
    <div class="kpi"><b id="kMatch">0</b><span>match</span></div>
    <div class="kpi"><b id="kClaims">0</b><span>claims</span></div>
    <div class="kpi"><b id="kRate">0</b><span>/min</span></div>
  </div>
  <button class="ghost" id="btnLogout" title="Cambiar key">⎋</button>
</header>

<main>
  <aside class="panel filters">
    <h3>Filtros</h3>
    <div class="field">
      <label>Rarezas</label>
      <div id="rarityChips" class="chips"></div>
    </div>
    <div class="field row">
      <div>
        <label>Kg mínimo</label>
        <input id="minKg" type="number" min="0" step="1" value="0" />
      </div>
      <div>
        <label>Kg máximo</label>
        <input id="maxKg" type="number" min="0" step="1" placeholder="∞" />
      </div>
    </div>
    <div class="field">
      <label>Buscar especie</label>
      <input id="search" type="text" placeholder="ej. Salamander" />
    </div>
    <label class="check"><input id="onlyFree" type="checkbox" /> Solo sin claim</label>
    <label class="check"><input id="autoScroll" type="checkbox" checked /> Auto refresh</label>

    <div class="divider"></div>
    <h3>Distribución</h3>
    <div id="dist" class="dist"></div>

    <div class="divider"></div>
    <h3>Endpoint AJ</h3>
    <code id="ajUrl" class="code"></code>
    <button class="ghost wide" id="btnCopy">Copiar URL base</button>
  </aside>

  <section class="panel feed">
    <div class="feed-head">
      <h3>Feed en vivo</h3>
      <div class="tabs">
        <button class="tab active" data-tab="eggs">Huevos</button>
        <button class="tab" data-tab="servers">Servers</button>
      </div>
    </div>

    <div id="tab-eggs" class="tab-body">
      <div class="table-head">
        <span>Huevo</span><span>Rareza</span><span>Peso</span><span>Server</span><span>Edad</span><span style="text-align:right">Acciones</span>
      </div>
      <div id="rows" class="rows"></div>
      <div id="empty" class="empty">Sin huevos que coincidan con los filtros.</div>
    </div>

    <div id="tab-servers" class="tab-body hidden">
      <div class="table-head srv">
        <span>Job ID</span><span>Jugadores</span><span>Huevos</span><span>Últ. reporte</span><span>Estado</span>
      </div>
      <div id="srows" class="rows"></div>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
